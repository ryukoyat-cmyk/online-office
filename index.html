<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="전주초등학교 온라인 교무실 — 오늘의 날씨, 오늘의 식단, 오늘의 일정, 학교 기초자료와 공유 드라이브를 한곳에서.">
  <title>온라인 교무실</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/environment.css">
  <script src="js/config.js" defer></script>
  <script src="js/environment.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main>
    <header class="hero">
      <div class="hero-title">
        <h1>전주초등학교 온라인 교무실</h1>
        <p class="hero-meta"><time id="heroDate"></time><span class="hero-dday" id="heroDday" aria-live="off"></span></p>
      </div>
      <form class="search" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <label class="sr-only" for="query">Google에서 검색하기</label>
        <input id="query" name="q" type="search" placeholder="Google에서 검색하기" autocomplete="on" required>
        <button type="submit" aria-label="Google 검색 (새 탭)"><span aria-hidden="true">↵</span></button>
      </form>
    </header>
    <section class="environment" aria-label="오늘의 날씨와 미세먼지">
      <div class="env-item weather-item" id="weatherPanel" data-scene="cloudy">
        <div id="weather-content" role="status" aria-live="polite"><p class="env-note">날씨 확인 중</p></div>
      </div>
      <div class="env-item air-item" id="airPanel" data-tone="unknown">
        <div id="air-content" role="status" aria-live="polite"><p class="env-note">관측값 확인 중</p></div>
      </div>
      <span class="alert-chip" id="alertChip" role="status" hidden></span>
      <p class="env-stamp" id="envStamp"></p>
      <noscript><p class="env-note">날씨와 미세먼지를 보려면 JavaScript를 켜 주세요. <a href="https://www.airkorea.or.kr/web/main.do">에어코리아 확인</a></p></noscript>
    </section>
    <section class="cards" aria-label="오늘의 식단과 학교 업무 바로가기">
      <article class="card meal-card" aria-labelledby="meal-title">
        <span class="index" aria-hidden="true">01 / TODAY’S LUNCH</span>
        <h2 id="meal-title">오늘의 식단</h2>
        <div id="meal-content" role="status" aria-live="polite"><p class="meal-message">식단 정보를 불러오는 중입니다.</p></div>
        <noscript><p>식단을 보려면 JavaScript를 켜 주세요.</p></noscript>
      </article>
      <a class="card link-card" id="schedule" href="https://docs.google.com/spreadsheets/d/1S9G-9O20as8rz_Sob7lVXcKczfeWxuiYNlxr-MALDlk/edit?usp=drive_link" target="_blank" rel="noopener noreferrer" aria-label="오늘의 일정 (새 탭)">
        <span class="index" aria-hidden="true">02 / SCHEDULE</span>
        <h2>오늘의 일정</h2>
        <div class="card-icon-wrap"><img class="card-icon" src="assets/schedule-icon.png" alt="오늘의 일정" width="96" height="96" loading="lazy" onerror="this.closest('.card-icon-wrap').style.display='none'"></div>
        <div class="card-bottom"><svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14 20 4"/><path d="M14 4h6v6"/><path d="M17 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h6"/></svg></div>
      </a>
      <a class="card link-card" id="school-data" href="https://docs.google.com/spreadsheets/d/1C-bhOsLn_u3k9JDVQ3D7w9lEkEW2xbzUGJxRSLqf250/edit?usp=drive_link" target="_blank" rel="noopener noreferrer" aria-label="우리학교 기초자료 (새 탭)">
        <span class="index" aria-hidden="true">03 / RESOURCES</span>
        <h2>우리학교 기초자료</h2>
        <div class="card-icon-wrap"><img class="card-icon" src="assets/resources-icon.png" alt="우리학교 기초자료" width="96" height="96" loading="lazy" onerror="this.closest('.card-icon-wrap').style.display='none'"></div>
        <div class="card-bottom"><svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14 20 4"/><path d="M14 4h6v6"/><path d="M17 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h6"/></svg></div>
      </a>
      <a class="card link-card" id="drive" href="https://drive.google.com/drive/folders/0AMq81Hlj4oJlUk9PVA" target="_blank" rel="noopener noreferrer" aria-label="우리학교 공유 드라이브 (새 탭)">
        <span class="index" aria-hidden="true">04 / SHARED DRIVE</span>
        <h2>우리학교<br>공유 드라이브</h2>
        <div class="card-icon-wrap"><img class="card-icon" src="assets/shared-drive-icon.png" alt="우리학교 공유 드라이브" width="96" height="96" loading="lazy" onerror="this.closest('.card-icon-wrap').style.display='none'"></div>
        <div class="card-bottom"><svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14 20 4"/><path d="M14 4h6v6"/><path d="M17 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h6"/></svg></div>
      </a>
      <a class="card link-card" id="jbe-portal" href="https://jbe.eduptl.kr/bpm_man_mn00_001.do" target="_blank" rel="noopener noreferrer" aria-label="전북 업무포털 (새 탭)">
        <span class="index" aria-hidden="true">05 / JBE PORTAL</span>
        <h2>전북 업무포털</h2>
        <div class="card-icon-wrap"><img class="card-icon" src="assets/image-1789117911660.webp" alt="전북 업무포털" width="96" height="96" loading="lazy" onerror="this.closest('.card-icon-wrap').style.display='none'"></div>
        <div class="card-bottom"><svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14 20 4"/><path d="M14 4h6v6"/><path d="M17 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h6"/></svg></div>
      </a>
    </section>
  </main>
  <footer>
    <p>전주초등학교 온라인 교무실</p>
    <p class="copyright">© 2026 Jaeyun</p>
  </footer>
</body>
</html>
