name: Update school dashboard and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    # Avoid the busy start of the hour; extra opportunities mitigate scheduler delays.
    - cron: '12,32,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch today's lunch
        id: meal
        continue-on-error: true
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python scripts/fetch_meal.py
      - name: Fetch today's weather
        id: weather
        continue-on-error: true
        run: python scripts/fetch_weather.py
      - name: Fetch AirKorea observations and official alerts
        timeout-minutes: 3
        id: air
        continue-on-error: true
        env:
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
        run: python scripts/fetch_air_quality.py
      - name: Compute upcoming events (D-day)
        id: dday
        continue-on-error: true
        run: python scripts/fetch_dday.py
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html favicon.svg _site/
          cp -r css js data assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report meal update failure
        # Evaluate every source, even when an earlier reporting step fails.
        if: always() && steps.deployment.outcome == 'success' && steps.meal.outcome == 'failure'
        run: |
          echo '::error::Meal update failed. Pages was deployed with an honest error state. Check NEIS availability and the optional NEIS_API_KEY secret.'
          exit 1
      - name: Report weather update failure
        if: always() && steps.deployment.outcome == 'success' && steps.weather.outcome == 'failure'
        run: |
          echo '::error::Weather update failed. Pages was deployed with an honest error state. Check Open-Meteo availability.'
          exit 1
      - name: Report D-day update failure
        if: always() && steps.deployment.outcome == 'success' && steps.dday.outcome == 'failure'
        run: |
          echo '::error::D-day update failed. Pages was deployed with an honest error state. Check data/dday-source.json for a valid label/date entry.'
          exit 1
      - name: Report air quality update failure
        if: always() && steps.deployment.outcome == 'success' && steps.air.outcome == 'failure'
        run: |
          echo '::error::AirKorea update failed. Pages retains the last dated Wansan-gu observation when available. Check AIRKOREA_API_KEY and permissions for observations and alerts.'
          exit 1
